name: Sync Google Scholar publications

on:
  schedule:
    - cron: '17 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-publications
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sync publications
        run: npm run sync:publications
      - name: Build site
        run: npm run build
      - name: Commit changes
        run: |
          if git diff --quiet -- src/data/publications-scholar.bib; then
            echo "Google Scholar is already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/publications-scholar.bib
          git commit -m "chore: sync Google Scholar publications"
          git push
